name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Fail fast on tags that do not match the project version, before hours of builds
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(grep -oP 'project\(Shprot VERSION \K[0-9.]+' Sources/CMakeLists.txt)"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $PROJECT_VERSION"
            exit 1
          fi

  build-windows:
    needs: check-version
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          # aqtinstall 3.3.0 (the latest release) can't install Qt 6.11+ on Windows, the fix is not released yet:
          # https://github.com/miurahr/aqtinstall/pull/1000. Return to the default when aqtinstall 3.4 is out.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7

      - name: Install NSIS if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      - name: Build installer
        shell: cmd
        env:
          QT_PREFIX: ${{ env.QT_ROOT_DIR }}
        run: call ReleaseWindows.cmd

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: Release/*.exe
          if-no-files-found: error

  build-linux:
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 300 # Building Qt for a new builder image takes a while
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            script: ReleaseUbuntu.sh
            package: deb
          - distro: fedora
            script: ReleaseFedora.sh
            package: rpm
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builder image is tagged with the Dockerfile hash, so it is rebuilt only when the Dockerfile changes
      - name: Prepare builder image
        env:
          DISTRO: ${{ matrix.distro }}
          PUSH_IMAGE: ${{ github.event_name != 'pull_request' }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REMOTE_IMAGE="ghcr.io/$OWNER/shprot-$DISTRO-builder:$(sha256sum "Dockerfile.$DISTRO" | cut -c1-16)"
          LOCAL_IMAGE="shprot-$DISTRO-builder"

          if docker pull "$REMOTE_IMAGE"; then
            docker tag "$REMOTE_IMAGE" "$LOCAL_IMAGE"
            exit 0
          fi

          echo "Builder image $REMOTE_IMAGE not found, building..."

          # Building Qt needs more disk space than the runner has free by default
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

          # Dockerfiles do not copy any files, so no build context is needed.
          # Official Qt download server is used instead of the default mirror meant for local builds.
          docker build --build-arg QT_MIRROR=https://download.qt.io -t "$LOCAL_IMAGE" - < "Dockerfile.$DISTRO"

          if [ "$PUSH_IMAGE" = "true" ]; then
            docker tag "$LOCAL_IMAGE" "$REMOTE_IMAGE"
            docker push "$REMOTE_IMAGE"
          fi

      - name: Build package
        run: ./${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.package }}
          path: Release/*.${{ matrix.package }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
          draft: true # Published manually after review

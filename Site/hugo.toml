baseURL = "https://shprot.mayfleet.com/"
title = "Shprot"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
disableKinds = ["taxonomy", "term", "section", "page", "RSS"]
enableRobotsTXT = true

[params]
  repo = "https://github.com/andrew-markin/shprot"
  # Overridden in CI by HUGO_PARAMS_VERSION with the tag of the latest published release
  version = "1.5"

[markup.goldmark.renderer]
  unsafe = false

# Images are shared with README, so the Assets folder is mounted instead of copied
[[module.mounts]]
  source = "../Assets"
  target = "assets/images"
[[module.mounts]]
  source = "assets"
  target = "assets"

[sitemap]
  changeFreq = "monthly"

# Keys are URL prefixes. Screenshot suffix matches file names in Assets (Screenshot-Light.<suffix>.png),
# languages without own screenshots use English ones.
[languages]
  [languages.en]
    weight = 1
    locale = "en"
    label = "English"
  [languages.ar]
    weight = 2
    locale = "ar"
    label = "العربية"
    direction = "rtl"
  [languages.fa]
    weight = 3
    locale = "fa"
    label = "فارسی"
    direction = "rtl"
  [languages.ru]
    weight = 4
    locale = "ru"
    label = "Русский"
    [languages.ru.params]
      screenshotSuffix = "ru"
  [languages.tr]
    weight = 5
    locale = "tr"
    label = "Türkçe"
  [languages.vi]
    weight = 6
    locale = "vi"
    label = "Tiếng Việt"
  [languages.zh-cn]
    weight = 7
    locale = "zh-CN"
    label = "简体中文"
    [languages.zh-cn.params]
      screenshotSuffix = "zh"
